<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3f7fc"/></linearGradient>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#78bed7"/><stop offset="1" stop-color="#2e6186"/></linearGradient>
  </defs>
  <style>
    .spin { animation: spin 6s linear infinite; transform-origin: 120px 100px; transform-box: view-box; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fill { animation: fill 14s linear infinite; transform-origin: left center; transform-box: fill-box; }
    @keyframes fill { from { transform: scaleX(.05); } to { transform: scaleX(.92); } }
    .b { animation: bar 1.1s ease-in-out infinite; transform-origin: bottom; transform-box: fill-box; }
    .b2 { animation-delay: -.2s; } .b3 { animation-delay: -.4s; } .b4 { animation-delay: -.6s; } .b5 { animation-delay: -.8s; }
    @keyframes bar { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    .shimmer { animation: shim 3.5s ease-in-out infinite; }
    @keyframes shim { 0% { transform: translateX(-260px); } 60%,100% { transform: translateX(900px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="2" y="2" width="896" height="196" rx="28" fill="url(#card)" stroke="#78bed7" stroke-width="1.5"/>
  <clipPath id="cl"><rect x="2" y="2" width="896" height="196" rx="28"/></clipPath>
  <g clip-path="url(#cl)"><rect class="shimmer" x="0" y="0" width="200" height="200" fill="#ffffff" opacity=".55"/></g>
  <g class="spin">
    <circle cx="120" cy="100" r="66" fill="#1e4a6e"/>
    <circle cx="120" cy="100" r="58" fill="none" stroke="#3d7196" stroke-width="2" opacity=".6"/>
    <circle cx="120" cy="100" r="44" fill="none" stroke="#3d7196" stroke-width="1.5" opacity=".5"/>
    <circle cx="120" cy="100" r="26" fill="#78bed7"/>
    <circle cx="120" cy="100" r="6" fill="#ffffff"/>
  </g>
  <text x="230" y="78" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="30" fill="#2e6186">Now building</text>
  <text x="230" y="112" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="22" fill="#3d7196">Auralyric · Android music player</text>
  <rect x="230" y="140" width="610" height="8" rx="4" fill="#cfeef7"/>
  <rect class="fill" x="230" y="140" width="610" height="8" rx="4" fill="url(#prog)"/>
  <g fill="#2e6186" opacity=".85">
    <rect class="b" x="720" y="88" width="8" height="40" rx="4"/><rect class="b b2" x="736" y="72" width="8" height="72" rx="4"/>
    <rect class="b b3" x="752" y="60" width="8" height="96" rx="4"/><rect class="b b4" x="768" y="80" width="8" height="56" rx="4"/>
    <rect class="b b5" x="784" y="68" width="8" height="84" rx="4"/>
  </g>
</svg>