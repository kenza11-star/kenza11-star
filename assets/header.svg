<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="340" viewBox="0 0 1600 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b2ecf7"/>
      <stop offset="0.55" stop-color="#e8faff"/>
      <stop offset="1" stop-color="#c9effa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#78bed7"/>
    </pattern>
    <radialGradient id="orb" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8fd6ea" stop-opacity="0.2"/>
    </radialGradient>
    <clipPath id="titleclip"><text x="800" y="150" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="92" letter-spacing="6">Hi, we're Kyn-X &amp; Kenn</text></clipPath>
  </defs>
  <style>
    .dots { animation: drift 16s linear infinite; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(24px,24px); } }
    .orb { animation: float 7s ease-in-out infinite; }
    .o2 { animation-delay: -2.5s; } .o3 { animation-delay: -4.5s; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
    .ring { animation: spin 26s linear infinite; transform-origin: 1290px 170px; transform-box: view-box; }
    .ring2 { animation: spin 40s linear infinite reverse; transform-origin: 1290px 170px; transform-box: view-box; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sparkle { animation: twinkle 3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .s2 { animation-delay: -1s; } .s3 { animation-delay: -2s; } .s4 { animation-delay: -0.5s; }
    @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.8) rotate(0deg); } 50% { opacity: 1; transform: scale(1.15) rotate(45deg); } }
    .title { animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .sweep { animation: sweep 4s ease-in-out 1.6s infinite; }
    @keyframes sweep { 0% { transform: translateX(-640px); } 55%,100% { transform: translateX(640px); } }
    .tag { animation: rise 1.2s .3s cubic-bezier(.2,.8,.2,1) both; }
    .bar { animation: bar 1.3s ease-in-out infinite; transform-origin: bottom; transform-box: fill-box; }
    .b2 { animation-delay: -.15s; } .b3 { animation-delay: -.3s; } .b4 { animation-delay: -.45s; } .b5 { animation-delay: -.6s; } .b6 { animation-delay: -.75s; }
    @keyframes bar { 0%,100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
    .type { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 3.2s ease-out .4s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .type { stroke-dashoffset: 0; } }
  </style>

  <rect width="1600" height="340" fill="url(#bg)"/>
  <rect class="dots" x="-24" y="-24" width="1648" height="388" fill="url(#dots)" opacity=".45"/>
  <circle cx="1290" cy="170" r="240" fill="none" stroke="#78bed7" stroke-width="2" stroke-dasharray="6 14" opacity=".7" class="ring"/>
  <circle cx="1290" cy="170" r="300" fill="none" stroke="#96bed7" stroke-width="1.5" stroke-dasharray="2 18" opacity=".6" class="ring2"/>

  <circle class="orb" cx="180" cy="110" r="46" fill="url(#orb)" opacity=".8"/>
  <circle class="orb o2" cx="1440" cy="70" r="28" fill="url(#orb)" opacity=".8"/>
  <circle class="orb o3" cx="1380" cy="290" r="36" fill="url(#orb)" opacity=".7"/>
  <circle class="orb o2" cx="90" cy="290" r="22" fill="url(#orb)" opacity=".7"/>

  <path class="sparkle" d="M260 60 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z" fill="#ffffff"/>
  <path class="sparkle s2" d="M1520 220 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#ffffff"/>
  <path class="sparkle s3" d="M700 40 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#ffffff"/>
  <path class="sparkle s4" d="M1180 300 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#ffffff"/>

  <g fill="#1e4a6e" opacity=".85">
    <rect class="bar" x="640" y="270" width="10" height="36" rx="5"/>
    <rect class="bar b2" x="658" y="256" width="10" height="50" rx="5"/>
    <rect class="bar b3" x="676" y="244" width="10" height="62" rx="5"/>
    <rect class="bar b4" x="694" y="256" width="10" height="50" rx="5"/>
    <rect class="bar b5" x="712" y="270" width="10" height="36" rx="5"/>
    <rect class="bar b6" x="730" y="256" width="10" height="50" rx="5"/>
    <rect class="bar" x="748" y="244" width="10" height="62" rx="5"/>
    <rect class="bar b2" x="766" y="256" width="10" height="50" rx="5"/>
    <rect class="bar b3" x="784" y="270" width="10" height="36" rx="5"/>
    <rect class="bar b4" x="802" y="256" width="10" height="50" rx="5"/>
    <rect class="bar b5" x="820" y="244" width="10" height="62" rx="5"/>
    <rect class="bar b6" x="838" y="256" width="10" height="50" rx="5"/>
    <rect class="bar" x="856" y="270" width="10" height="36" rx="5"/>
    <rect class="bar b2" x="874" y="256" width="10" height="50" rx="5"/>
    <rect class="bar b3" x="892" y="270" width="10" height="36" rx="5"/>
  </g>

  <g class="title">
    <text x="800" y="150" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="92" letter-spacing="6" fill="#2e6186">Hi, we're Kyn-X &amp; Kenn</text>
  </g>
  <g clip-path="url(#titleclip)">
    <rect class="sweep" x="480" y="40" width="240" height="160" fill="url(#shine)"/>
  </g>
  <text class="tag" x="800" y="215" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="30" letter-spacing="8" fill="#3d7196">BUILDING AURALYRIC</text>
  <path class="type" d="M560 262 H1040" stroke="#78b8d6" stroke-width="2" fill="none" opacity=".9"/>
</svg>
