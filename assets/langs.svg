<svg xmlns="http://www.w3.org/2000/svg" width="500" height="290" viewBox="0 0 500 290">
  <style>
    .card { animation: pop .8s cubic-bezier(.2,.8,.2,1) both; transform-origin: center; transform-box: fill-box; }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
    .row { opacity: 0; animation: fade .7s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes fade { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    .bar { transform-origin: left center; transform-box: fill-box; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .title { font: 700 22px Poppins, 'Segoe UI', Arial, sans-serif; fill: #2e6186; }
    .label { font: 600 16px Poppins, 'Segoe UI', Arial, sans-serif; fill: #3d7196; }
    .value { font: 700 15px Poppins, 'Segoe UI', Arial, sans-serif; fill: #2e6186; }
    .sep { stroke: #cfeef7; stroke-width: 1.5; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
  <g class="card">
    <rect x="2" y="2" width="496" height="286" rx="22" fill="#ffffff" stroke="#78bed7" stroke-width="1.5"/>
    <text x="36" y="50" class="title">Top languages</text>
    <line x1="36" y1="66" x2="464" y2="66" class="sep"/>
  <g class="row" style="animation-delay:0.15s"><circle cx="40" cy="87" r="6" fill="#A97BFF"/><text x="56" y="92" class="label">Kotlin</text><rect x="170" y="80" width="300" height="12" rx="6" fill="#eaf7fb"/><rect class="bar" style="animation-delay:0.30s" x="170" y="80" width="265.7" height="12" rx="6" fill="#A97BFF"/><text x="464" y="92" class="value" text-anchor="end">88.6%</text></g>
  <g class="row" style="animation-delay:0.25s"><circle cx="40" cy="117" r="6" fill="#F1E05A"/><text x="56" y="122" class="label">JavaScript</text><rect x="170" y="110" width="300" height="12" rx="6" fill="#eaf7fb"/><rect class="bar" style="animation-delay:0.40s" x="170" y="110" width="12.7" height="12" rx="6" fill="#F1E05A"/><text x="464" y="122" class="value" text-anchor="end">4.2%</text></g>
  <g class="row" style="animation-delay:0.35s"><circle cx="40" cy="147" r="6" fill="#3178C6"/><text x="56" y="152" class="label">TypeScript</text><rect x="170" y="140" width="300" height="12" rx="6" fill="#eaf7fb"/><rect class="bar" style="animation-delay:0.50s" x="170" y="140" width="11.3" height="12" rx="6" fill="#3178C6"/><text x="464" y="152" class="value" text-anchor="end">3.8%</text></g>
  <g class="row" style="animation-delay:0.45s"><circle cx="40" cy="177" r="6" fill="#E34C26"/><text x="56" y="182" class="label">HTML</text><rect x="170" y="170" width="300" height="12" rx="6" fill="#eaf7fb"/><rect class="bar" style="animation-delay:0.60s" x="170" y="170" width="6.1" height="12" rx="6" fill="#E34C26"/><text x="464" y="182" class="value" text-anchor="end">2.0%</text></g>
  <g class="row" style="animation-delay:0.55s"><circle cx="40" cy="207" r="6" fill="#3572A5"/><text x="56" y="212" class="label">Python</text><rect x="170" y="200" width="300" height="12" rx="6" fill="#eaf7fb"/><rect class="bar" style="animation-delay:0.70s" x="170" y="200" width="4.0" height="12" rx="6" fill="#3572A5"/><text x="464" y="212" class="value" text-anchor="end">0.5%</text></g>
  <g class="row" style="animation-delay:0.65s"><circle cx="40" cy="237" r="6" fill="#78BED7"/><text x="56" y="242" class="label">PLpgSQL</text><rect x="170" y="230" width="300" height="12" rx="6" fill="#eaf7fb"/><rect class="bar" style="animation-delay:0.80s" x="170" y="230" width="4.0" height="12" rx="6" fill="#78BED7"/><text x="464" y="242" class="value" text-anchor="end">0.4%</text></g>
  </g>
</svg>
