<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#b2ecf7"/><stop offset="0.5" stop-color="#e8faff"/><stop offset="1" stop-color="#c9effa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;-0.15 0.1;0 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#78bed7"/></pattern>
    <radialGradient id="orb" cx="0.35" cy="0.35" r="0.7"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8fd6ea" stop-opacity="0.2"/></radialGradient>
    <clipPath id="titleclip"><text x="800" y="170" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="104" letter-spacing="6">Hi, I'm Kyn-X</text></clipPath>
  </defs>
  <style>
    .dots { animation: drift 18s linear infinite; }
    @keyframes drift { to { transform: translate(24px,24px); } }
    .orb { animation: float 8s ease-in-out infinite; } .o2 { animation-delay: -2.5s; } .o3 { animation-delay: -4.5s; }
    @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(0,-22px); } }
    .pt { animation: rise-pt linear infinite; }
    @keyframes rise-pt { from { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .9; } to { transform: translateY(-40px); opacity: 0; } }
    .ring { animation: spin 28s linear infinite; transform-origin: 1290px 180px; transform-box: view-box; }
    .ring2 { animation: spin 44s linear infinite reverse; transform-origin: 1290px 180px; transform-box: view-box; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .orbit { animation: spin 9s linear infinite; transform-origin: 1290px 180px; transform-box: view-box; }
    .note { animation: note 7s ease-in-out infinite; } .n2 { animation-delay: -2.3s; } .n3 { animation-delay: -4.6s; }
    @keyframes note { 0%,100% { transform: translateY(0) rotate(-6deg); opacity: .5; } 50% { transform: translateY(-26px) rotate(6deg); opacity: 1; } }
    .sparkle { animation: twinkle 3.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .s2 { animation-delay: -1s; } .s3 { animation-delay: -2s; } .s4 { animation-delay: -.5s; }
    @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.8) rotate(0deg); } 50% { opacity: 1; transform: scale(1.15) rotate(45deg); } }
    .ch { font-family: Poppins, 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 104px; fill: #2e6186; opacity: 0; transform-box: fill-box; transform-origin: center; animation: letter .9s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes letter { from { opacity: 0; transform: translateY(28px) scale(.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .sweep { animation: sweep 4.5s ease-in-out 2.4s infinite; }
    @keyframes sweep { 0% { transform: translateX(-640px); } 55%,100% { transform: translateX(640px); } }
    .tag { opacity: 0; animation: rise 1.1s 1.4s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .bar { animation: bar 1.3s ease-in-out infinite; transform-origin: bottom; transform-box: fill-box; }
    .b2 { animation-delay: -.15s; } .b3 { animation-delay: -.3s; } .b4 { animation-delay: -.45s; } .b5 { animation-delay: -.6s; } .b6 { animation-delay: -.75s; }
    @keyframes bar { 0%,100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
    .role { opacity: 0; animation: roles 9s ease-in-out infinite; font-family: Poppins, 'Segoe UI', Arial, sans-serif; font-weight: 600; font-size: 30px; letter-spacing: 6px; fill: #3d7196; }
    .r2 { animation-delay: -3s; } .r3 { animation-delay: -6s; }
    @keyframes roles { 0%,28% { opacity: 0; transform: translateY(8px); } 6%,24% { opacity: 1; transform: translateY(0); } 33%,100% { opacity: 0; transform: translateY(-8px); } }
    .line { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 3s 1s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .eq { animation: bar 1.1s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ch, .tag, .line { opacity: 1; stroke-dashoffset: 0; } .role:first-of-type { opacity: 1; } }
  </style>
