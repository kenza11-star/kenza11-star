<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="110" viewBox="0 0 1600 110">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#78bed7"/><stop offset="0.5" stop-color="#2e6186"/><stop offset="1" stop-color="#78bed7"/></linearGradient></defs>
  <style>
    .w { animation: wave 6s ease-in-out infinite; }
    .w2 { animation-duration: 8s; animation-direction: reverse; } .w3 { animation-duration: 10s; }
    @keyframes wave { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-80px); } }
    .dot { animation: pulse 2.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .d2 { animation-delay: -.4s; } .d3 { animation-delay: -.8s; } .d4 { animation-delay: -1.2s; } .d5 { animation-delay: -1.6s; }
    @keyframes pulse { 0%,100% { transform: scale(.6); opacity: .35; } 50% { transform: scale(1.3); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <path class="w" d="M-200 50 Q -100 20 0 50 T 200 50 T 400 50 T 600 50 T 800 50 T 1000 50 T 1200 50 T 1400 50 T 1600 50 T 1800 50 V110 H-200Z" fill="url(#g)" opacity=".3"/>
  <path class="w w2" d="M-200 70 Q -100 42 0 70 T 200 70 T 400 70 T 600 70 T 800 70 T 1000 70 T 1200 70 T 1400 70 T 1600 70 T 1800 70 V110 H-200Z" fill="url(#g)" opacity=".45"/>
  <path class="w w3" d="M-200 90 Q -100 66 0 90 T 200 90 T 400 90 T 600 90 T 800 90 T 1000 90 T 1200 90 T 1400 90 T 1600 90 T 1800 90 V110 H-200Z" fill="url(#g)" opacity=".6"/>
  <circle class="dot" cx="740" cy="36" r="6" fill="#2e6186"/><circle class="dot d2" cx="780" cy="36" r="6" fill="#2e6186"/>
  <circle class="dot d3" cx="820" cy="36" r="6" fill="#2e6186"/><circle class="dot d4" cx="860" cy="36" r="6" fill="#2e6186"/>
  <circle class="dot d5" cx="900" cy="36" r="6" fill="#2e6186"/>
</svg>